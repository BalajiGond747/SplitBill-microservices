name: splitbill

services:


  mysql:
    image: mysql:8.4
    container_name: splitbill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: user_db
      MYSQL_USER: splitbill
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped


  kafka:
    image: apache/kafka:4.0.1
    container_name: splitbill-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: splitbill-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped


  user-service:
    build: ./backend/services/user-service
    container_name: splitbill-user-service
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped


  auth-service:
    build: ./backend/services/auth-service
    container_name: splitbill-auth-service
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

      AUTH_ISSUER: ${AUTH_ISSUER}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}

      PASSWORD_RESET_BASE_URL: http://localhost:5173/reset-password

      APP_USER_SERVICE_BASE_URL: http://user-service:8081

    ports:
      - "8088:8088"

    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_started

    restart: unless-stopped


  group-service:
    build: ./backend/services/group-service
    container_name: splitbill-group-service
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/group_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped


  expense-service:
    build: ./backend/services/expense-service
    container_name: splitbill-expense-service
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expense_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started

    restart: unless-stopped


  balance-service:
    build: ./backend/services/balance-service
    container_name: splitbill-balance-service
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/balance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

    restart: unless-stopped


  settlement-service:
    build: ./backend/services/settlement-service
    container_name: splitbill-settlement-service
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/settlement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

      BALANCE_SERVICE_URL: http://balance-service:8084

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped


  payment-service:
    build: ./backend/services/payment-service
    container_name: splitbill-payment-service
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

      SETTLEMENT_SERVICE_URL: http://settlement-service:8085

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}

    depends_on:
      mysql:
        condition: service_healthy
      settlement-service:
        condition: service_started

    restart: unless-stopped


  notification-service:
    build: ./backend/services/notification-service
    container_name: splitbill-notification-service
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started

    restart: unless-stopped


  api-gateway:
    build: ./backend/services/api-gateway
    container_name: splitbill-api-gateway

    ports:
      - "8080:8080"

    environment:

      APP_AUTH_SERVICE_JWK_SET_URI: http://auth-service:8088/oauth2/jwks
      APP_JWT_ISSUER: ${AUTH_ISSUER}

    depends_on:
      - user-service
      - auth-service
      - group-service
      - expense-service
      - balance-service
      - settlement-service
      - payment-service
      - notification-service

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080

    container_name: splitbill-frontend

    ports:
      - "5173:80"

    depends_on:
      - api-gateway

    restart: unless-stopped


volumes:
  mysql_data:
  kafka_data:
  redis_data: