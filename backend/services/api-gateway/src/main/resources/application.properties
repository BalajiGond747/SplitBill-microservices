spring.application.name=api-gateway
server.port=8080
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.server.webflux.routes[1].id=group-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/groups/**
spring.cloud.gateway.server.webflux.routes[2].id=expense-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/expenses/**
spring.cloud.gateway.server.webflux.routes[3].id=balance-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/balances/**
spring.cloud.gateway.server.webflux.routes[4].id=settlement-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/settlements/**
spring.cloud.gateway.server.webflux.routes[5].id=payment-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.server.webflux.routes[6].id=notification-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.server.webflux.routes[7].id=auth-service
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8088
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/v1/auth/**
app.auth-service.jwk-set-uri=http://localhost:8088/oauth2/jwks
app.jwt.issuer=http://localhost:8088
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true