spring.application.name=balance-service
server.port=8084


spring.datasource.url=jdbc:mysql://localhost:3306/balance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true


spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=balance-service
spring.kafka.consumer.auto-offset-reset=earliest


spring.data.redis.host=localhost
spring.data.redis.port=6379


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always