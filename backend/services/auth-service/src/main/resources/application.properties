spring.application.name=auth-service
server.port=8088
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER:http://localhost:8088}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.google.client-id=${GOOGLE_CLIENT_ID}
app.mail.from=${MAIL_FROM:}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
app.password-reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:15}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
app.user-service.base-url=http://localhost:8081
app.jwt.issuer=${AUTH_ISSUER:http://localhost:8088}
app.jwt.access-token-expiry-seconds=900

